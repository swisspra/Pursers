[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-acp"
version = "0.1.1"
description = "A small ACP board assistant for Pursers Personal"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pursers-client==0.1.2",
  "pursers-personal==5.0.3",
  "pursers-wait-bridge==0.1.0",
]

[project.scripts]
pursers-acp = "pursers_acp.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_acp*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/client/src", "../../packages/central/src"]
