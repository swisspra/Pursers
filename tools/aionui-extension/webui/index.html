<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pursers</title>
    <link rel="stylesheet" href="/pursers/assets/style.css">
  </head>
  <body>
    <main>
      <h1>Pursers</h1>
      <p class="intro">Join a worker or reviewer seat with a door from your coordinator.</p>
      <form id="join-form">
        <label for="door">Paste your door</label>
        <input id="door" name="door" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit">Join</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="connection-card" aria-labelledby="connection-title" hidden>
        <h2 id="connection-title">Connection state</h2>
        <dl>
          <dt>Central</dt><dd data-connection="central">—</dd>
          <dt>Board join</dt><dd data-connection="board">—</dd>
          <dt>AionUi helper</dt><dd data-connection="helper">—</dd>
        </dl>
        <button id="recover" class="secondary" type="button" hidden>Recover</button>
      </section>
      <section id="status-card" aria-labelledby="status-title" hidden>
        <div class="status-heading">
          <span id="status-icon" class="status-icon" aria-hidden="true"></span>
          <div>
            <h2 id="status-title">Status</h2>
            <p id="status-summary"></p>
          </div>
        </div>
        <div id="seat-list" class="seat-list"></div>
      </section>
      <section id="next-step" aria-labelledby="next-step-title" hidden>
        <p class="next-step-label">Next step</p>
        <h2 id="next-step-title">Start a new conversation</h2>
        <p id="next-step-summary"></p>
        <ul id="preset-list" class="preset-list"></ul>
      </section>
    </main>
    <script src="/pursers/assets/app.js"></script>
  </body>
</html>
