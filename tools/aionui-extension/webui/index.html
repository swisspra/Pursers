<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pursers</title>
    <link rel="stylesheet" href="/pursers/assets/style.css">
  </head>
  <body>
    <main>
      <h1>Pursers</h1>
      <p class="intro">Join a worker or reviewer seat with a door from your coordinator.</p>
      <form id="join-form">
        <label for="door">Paste your door</label>
        <input id="door" name="door" type="password" autocomplete="off" spellcheck="false" required>
        <button id="validate-door" type="submit">Validate door</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="door-confirmation" aria-labelledby="door-confirmation-title" hidden>
        <h2 id="door-confirmation-title">Confirm connection</h2>
        <p>Review the redacted door details. Nothing connects until you select Connect.</p>
        <dl id="door-preview"></dl>
        <div class="confirmation-actions">
          <button id="connect-door" type="button">Connect</button>
          <button id="cancel-door" class="secondary" type="button">Cancel</button>
        </div>
      </section>
      <section id="status-card" aria-labelledby="status-title" hidden>
        <div class="status-heading">
          <span id="status-icon" class="status-icon" aria-hidden="true"></span>
          <div>
            <h2 id="status-title">Status</h2>
            <p id="status-summary"></p>
          </div>
        </div>
        <div id="seat-list" class="seat-list"></div>
      </section>
    </main>
    <script src="/pursers/assets/app.js"></script>
  </body>
</html>
