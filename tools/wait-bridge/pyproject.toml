[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-wait-bridge"
version = "0.1.0a12"
description = "Blocking wait-for-work MCP bridge for Pursers"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pursers-client==0.1.0a19",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
pursers-wait-bridge = "pursers_wait_server:main"
pursers-door = "door_admin:main"

[tool.setuptools]
py-modules = ["pursers_wait_server", "agent_naming", "backlog", "door_admin", "registry_admin", "registry_doctor", "seat_admin"]
