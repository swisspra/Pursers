name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      UV_VERSION: "0.12.16"
    steps:
      - name: Resolve release tag
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "release tag must match v* and contain only version characters: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Verify exact tag checkout
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: python tools/release_publish.py "$TAG" verify-checkout

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned wheel-build toolchain
        run: |
          set -euo pipefail
          mapfile -t build_toolchain < <(python - <<'PY'
          import tomllib

          with open("tools/release_versions.toml", "rb") as stream:
              build_toolchain = tomllib.load(stream)["build_toolchain"]
          for name, version in build_toolchain.items():
              print(f"{name}=={version}")
          PY
          )
          python -m pip install --disable-pip-version-check --no-input \
            "${build_toolchain[@]}" "uv==$UV_VERSION"
          test "$(uv --version | awk '{print $1, $2}')" = "uv $UV_VERSION"
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.regenerate_component_lock import SOURCE_DATE_EPOCH

          print(f"SOURCE_DATE_EPOCH={SOURCE_DATE_EPOCH}")
          PY
          python - <<'PY'
          import importlib.metadata as metadata
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          expected = dict(BUILD_TOOLCHAIN)
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r} != {expected!r}")
          print(f"build_toolchain={actual}")
          PY

      - name: Validate tag against release manifest
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          from tools.release_versions import release_version_from_tag

          version = release_version_from_tag(os.environ["TAG"])
          print(f"release_version={version}; prerelease={version.is_prerelease}")
          PY

      - name: Build all seven wheels
        run: |
          set -euo pipefail
          mkdir dist
          for project in central client import personal; do
            python -m build --wheel --no-isolation \
              --outdir dist "packages/$project"
          done
          python -m pip wheel --no-deps --no-build-isolation \
            --wheel-dir dist packages/pursers tools/wait-bridge tools/acp-agent
          python - <<'PY'
          from pathlib import Path
          from tools.release_versions import expected_wheel_filenames

          actual = {wheel.name for wheel in Path("dist").glob("*.whl")}
          expected = set(expected_wheel_filenames())
          if actual != expected:
              raise SystemExit(
                  f"release wheel cohort mismatch: actual={sorted(actual)!r}; "
                  f"expected={sorted(expected)!r}"
              )
          print("release_wheels=" + ",".join(sorted(actual)))
          PY

      - name: Build deterministic AionUi and Home runtime artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          artifact_a="$RUNNER_TEMP/release-artifacts-a"
          artifact_b="$RUNNER_TEMP/release-artifacts-b"
          mkdir -p "$artifact_a" "$artifact_b"

          aion_archive="$(python - <<'PY'
          import json

          with open("tools/aionui-extension/aion-extension.json") as stream:
              version = json.load(stream)["version"]
          print(f"pursers-aionui-{version}.zip")
          PY
          )"
          python tools/aionui-extension/build.py \
            --output "$artifact_a/$aion_archive"
          python tools/aionui-extension/build.py \
            --output "$artifact_b/$aion_archive"
          cmp -s "$artifact_a/$aion_archive" "$artifact_b/$aion_archive"
          cp "$artifact_a/$aion_archive" dist/

          wheelhouse_name="pursers-home-runtime-wheelhouse-${VERSION}-linux-x86_64"
          python tools/build_home_runtime_wheelhouse.py \
            --python "$(command -v python)" \
            --output "$artifact_a/$wheelhouse_name"
          python tools/build_home_runtime_wheelhouse.py \
            --python "$(command -v python)" \
            --output "$artifact_b/$wheelhouse_name"
          for root in "$artifact_a" "$artifact_b"; do
            python - "$root/$wheelhouse_name" <<'PY'
          import os
          import sys
          from pathlib import Path

          wheelhouse = Path(sys.argv[1])
          timestamp = int(os.environ["SOURCE_DATE_EPOCH"])
          for path in (wheelhouse, *sorted(wheelhouse.rglob("*"))):
              os.utime(path, (timestamp, timestamp), follow_symlinks=False)
          PY
            python tools/deterministic_tar.py \
              "$root" "$wheelhouse_name" "$root/$wheelhouse_name.tar.gz"
          done
          cmp -s \
            "$artifact_a/$wheelhouse_name.tar.gz" \
            "$artifact_b/$wheelhouse_name.tar.gz"
          cmp -s \
            "$artifact_a/$wheelhouse_name/wheelhouse.json" \
            "$artifact_b/$wheelhouse_name/wheelhouse.json"
          cp "$artifact_a/$wheelhouse_name.tar.gz" dist/
          cp \
            "$artifact_a/$wheelhouse_name/wheelhouse.json" \
            "dist/$wheelhouse_name.json"

          (cd dist && sha256sum -- \
            ./*.whl ./*.zip ./*.tar.gz ./*.json > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          find dist -maxdepth 1 -type f -print | sort

      - name: Extract non-empty CHANGELOG notes
        run: |
          python tools/release_notes.py \
            "${{ steps.release.outputs.version }}" > release-notes.md
          test -s release-notes.md

      - name: Create or complete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            dist/*.whl
            dist/*.zip
            dist/*.tar.gz
            dist/*wheelhouse*.json
            dist/SHA256SUMS.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t release_flags < <(python tools/release_publish.py "$TAG" edit)
            declare -A uploaded=()
            declare -A local_assets=()
            for asset in "${assets[@]}"; do
              local_assets["$(basename "$asset")"]="$asset"
            done
            mkdir existing-release-assets
            while IFS= read -r name; do
              local_asset="${local_assets[$name]:-}"
              if [[ -z "$local_asset" ]]; then
                echo "unexpected existing release asset: $name" >&2
                exit 1
              fi
              gh release download "$TAG" \
                --pattern "$name" \
                --dir existing-release-assets
              python tools/release_publish.py "$TAG" verify-asset \
                --local "$local_asset" \
                --existing "existing-release-assets/$name"
              uploaded["$name"]=1
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              if [[ -n "${uploaded[$name]:-}" ]]; then
                echo "verified existing asset: $name"
              else
                gh release upload "$TAG" "$asset"
              fi
            done
            gh release edit "$TAG" \
              --title "Pursers $VERSION" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          else
            mapfile -t release_flags < <(python tools/release_publish.py "$TAG" create)
            gh release create "$TAG" "${assets[@]}" \
              --verify-tag \
              --title "Pursers $VERSION" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi
