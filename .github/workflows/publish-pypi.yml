name: publish-pypi

# Publishes the two remaining Pursers distributions to PyPI via Trusted
# Publishing (OIDC, no API token). Trigger manually from the Actions tab.
#
# PyPI allows one pending publisher per (repo, workflow, environment) tuple,
# so each project name gets its own job + environment:
#   pursers-personal-import -> environment: pypi
#   pursers-wait-bridge     -> environment: pypi-bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-import:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pursers-personal-import wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/import
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-wait-bridge:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pursers-wait-bridge wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist tools/wait-bridge
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
