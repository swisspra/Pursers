name: publish-pypi

# Publishes all Pursers distributions to PyPI via Trusted Publishing
# (OIDC, no API token). Trigger manually from the Actions tab.
#
# Environment mapping (per-project trusted publishers on PyPI):
#   pypi        -> pursers, pursers-central, pursers-client,
#                  pursers-personal, pursers-personal-import
#   pypi-bridge -> pursers-wait-bridge
# (pending publishers required distinct environments per project; regular
#  per-project publishers share the `pypi` environment.)
# skip-existing: already-published versions are skipped, so a run only
# uploads distributions whose version was bumped.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-main:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the five main-environment wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist packages/pursers
          python -m build --wheel --outdir dist packages/central
          python -m build --wheel --outdir dist packages/client
          python -m build --wheel --outdir dist packages/personal
          python -m build --wheel --outdir dist packages/import
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-wait-bridge:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pursers-wait-bridge wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist tools/wait-bridge
          ls -l dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
