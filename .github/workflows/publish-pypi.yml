name: publish-pypi

# Publishes all Pursers distributions to PyPI via Trusted Publishing
# (OIDC, no API token). Trigger manually from the Actions tab.
#
# Environment mapping (per-project trusted publishers on PyPI):
#   pypi        -> pursers, pursers-central, pursers-client,
#                  pursers-personal, pursers-personal-import
#   pypi-bridge -> pursers-wait-bridge
# (pending publishers required distinct environments per project; regular
#  per-project publishers share the `pypi` environment.)
# skip-existing: already-published versions are skipped, so a run only
# uploads distributions whose version was bumped.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-main:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned wheel-build toolchain
        run: |
          set -euo pipefail
          mapfile -t build_toolchain < <(python - <<'PY'
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          for name, version in BUILD_TOOLCHAIN:
              print(f"{name}=={version}")
          PY
          )
          python -m pip install --disable-pip-version-check --no-input \
            "${build_toolchain[@]}"
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.regenerate_component_lock import SOURCE_DATE_EPOCH

          print(f"SOURCE_DATE_EPOCH={SOURCE_DATE_EPOCH}")
          PY
          python - <<'PY'
          import importlib.metadata as metadata
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          expected = dict(BUILD_TOOLCHAIN)
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r} != {expected!r}")
          print(f"build_toolchain={actual}")
          PY

      - name: Build the five main-environment wheels
        run: |
          set -euo pipefail
          mkdir dist
          python -m build --wheel --no-isolation --outdir dist packages/pursers
          python -m build --wheel --no-isolation --outdir dist packages/central
          python -m build --wheel --no-isolation --outdir dist packages/client
          python -m build --wheel --no-isolation --outdir dist packages/personal
          python -m build --wheel --no-isolation --outdir dist packages/import
          ls -l dist

      - name: Verify component lock and wheel generators
        run: |
          set -euo pipefail
          python tools/verify_publish_wheels.py --wheel-dir dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  publish-wait-bridge:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned wheel-build toolchain
        run: |
          set -euo pipefail
          mapfile -t build_toolchain < <(python - <<'PY'
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          for name, version in BUILD_TOOLCHAIN:
              print(f"{name}=={version}")
          PY
          )
          python -m pip install --disable-pip-version-check --no-input \
            "${build_toolchain[@]}"
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.regenerate_component_lock import SOURCE_DATE_EPOCH

          print(f"SOURCE_DATE_EPOCH={SOURCE_DATE_EPOCH}")
          PY
          python - <<'PY'
          import importlib.metadata as metadata
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          expected = dict(BUILD_TOOLCHAIN)
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r} != {expected!r}")
          print(f"build_toolchain={actual}")
          PY

      - name: Build pursers-wait-bridge wheel
        run: |
          set -euo pipefail
          mkdir dist
          python -m build --wheel --no-isolation --outdir dist tools/wait-bridge
          ls -l dist

      - name: Verify wheel generator
        run: |
          set -euo pipefail
          python tools/verify_publish_wheels.py \
            --wheel-dir dist --generators-only

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
