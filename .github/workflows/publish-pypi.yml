name: publish-pypi

# Publishes all Pursers distributions to PyPI via Trusted Publishing
# (OIDC, no API token). Trigger manually from the Actions tab.
#
# Environment mapping (per-project trusted publishers on PyPI):
#   pypi        -> pursers, pursers-central, pursers-client,
#                  pursers-personal, pursers-personal-import, pursers-acp
#   pypi-bridge -> pursers-wait-bridge
# (pending publishers required distinct environments per project; regular
#  per-project publishers share the `pypi` environment.)
# The pre-publish PyPI comparison rejects changed same-version wheels before
# skip-existing can silently ignore them; only new, bumped versions are uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

# Keep the PyPI check and upload in one repository-wide critical section. A
# second manual run must not observe a new version before the first run uploads
# different bytes for that same version.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish-main:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned wheel-build toolchain
        run: |
          set -euo pipefail
          mapfile -t build_toolchain < <(python - <<'PY'
          import tomllib

          with open("tools/release_versions.toml", "rb") as stream:
              build_toolchain = tomllib.load(stream)["build_toolchain"]
          for name, version in build_toolchain.items():
              print(f"{name}=={version}")
          PY
          )
          python -m pip install --disable-pip-version-check --no-input \
            "${build_toolchain[@]}"
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.regenerate_component_lock import SOURCE_DATE_EPOCH

          print(f"SOURCE_DATE_EPOCH={SOURCE_DATE_EPOCH}")
          PY
          python - <<'PY'
          import importlib.metadata as metadata
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          expected = dict(BUILD_TOOLCHAIN)
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r} != {expected!r}")
          print(f"build_toolchain={actual}")
          PY

      - name: Build the six main-environment wheels
        run: |
          set -euo pipefail
          mkdir dist
          python -m build --wheel --no-isolation --outdir dist packages/pursers
          python -m build --wheel --no-isolation --outdir dist packages/central
          python -m build --wheel --no-isolation --outdir dist packages/client
          python -m build --wheel --no-isolation --outdir dist packages/personal
          python -m build --wheel --no-isolation --outdir dist packages/import
          python -m build --wheel --no-isolation --outdir dist tools/acp-agent
          ls -l dist

      - name: Verify component lock and wheel generators
        run: |
          set -euo pipefail
          python tools/verify_publish_wheels.py --wheel-dir dist --verify-pypi

      # PyPI refuses to let a trusted publisher create a new project, so the
      # first pursers-acp upload fails until a pending publisher exists. Upload
      # it separately so it can never block the dependencies that `pursers`
      # pins (v5.0.0 left pursers published without them).
      - name: Hold pursers-acp for its own upload
        run: |
          set -euo pipefail
          mkdir dist-acp
          mv dist/pursers_acp-*.whl dist-acp/
          ls -l dist dist-acp

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Publish pursers-acp to PyPI (Trusted Publishing)
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-acp
          skip-existing: true

  publish-wait-bridge:
    runs-on: ubuntu-latest
    environment: pypi-bridge
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned wheel-build toolchain
        run: |
          set -euo pipefail
          mapfile -t build_toolchain < <(python - <<'PY'
          import tomllib

          with open("tools/release_versions.toml", "rb") as stream:
              build_toolchain = tomllib.load(stream)["build_toolchain"]
          for name, version in build_toolchain.items():
              print(f"{name}=={version}")
          PY
          )
          python -m pip install --disable-pip-version-check --no-input \
            "${build_toolchain[@]}"
          python - <<'PY' >> "$GITHUB_ENV"
          from tools.regenerate_component_lock import SOURCE_DATE_EPOCH

          print(f"SOURCE_DATE_EPOCH={SOURCE_DATE_EPOCH}")
          PY
          python - <<'PY'
          import importlib.metadata as metadata
          from tools.regenerate_component_lock import BUILD_TOOLCHAIN

          expected = dict(BUILD_TOOLCHAIN)
          actual = {name: metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r} != {expected!r}")
          print(f"build_toolchain={actual}")
          PY

      - name: Build pursers-wait-bridge wheel
        run: |
          set -euo pipefail
          mkdir dist
          python -m build --wheel --no-isolation --outdir dist tools/wait-bridge
          ls -l dist

      - name: Verify wheel generator
        run: |
          set -euo pipefail
          python tools/verify_publish_wheels.py \
            --wheel-dir dist --generators-only --verify-pypi

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
