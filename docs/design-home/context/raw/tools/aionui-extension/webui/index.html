<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pursers</title>
    <link rel="stylesheet" href="/pursers/assets/style.css">
  </head>
  <body>
    <main>
      <h1>Pursers</h1>
      <p class="intro">Join a worker or reviewer seat with a door from your coordinator.</p>
      <form id="join-form">
        <label for="door">Paste your door</label>
        <input id="door" name="door" type="password" autocomplete="off" spellcheck="false" required>
        <button type="submit">Join</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="status-card" hidden>
        <h2>Status</h2>
        <dl>
          <dt>Board</dt><dd data-field="board">—</dd>
          <dt>Role</dt><dd data-field="role">—</dd>
          <dt>Seat name</dt><dd data-field="seat_name">—</dd>
          <dt>Push mode</dt><dd data-field="push_mode">—</dd>
          <dt>Key ID</dt><dd data-field="kid">—</dd>
          <dt>Expires</dt><dd data-field="exp">—</dd>
        </dl>
      </section>
    </main>
    <script src="/pursers/assets/app.js"></script>
  </body>
</html>
