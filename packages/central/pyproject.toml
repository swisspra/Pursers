[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-central"
version = "0.1.2"
description = "Pursers Central: the multi-board MCP service that owns board state"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp[cli]==2.2.0",
  "pursers-client==0.1.3",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
pursers-central = "pursers_central.pursers_central_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_central*"]
