[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-central"
version = "0.1.0a13"
description = "Central multi-board On Board MCP service"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp[cli]==2.1.1",
  "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_central*"]
