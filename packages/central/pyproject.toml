[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-central"
version = "0.1.0a26"
description = "Central multi-board On Board MCP service"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp[cli]==2.1.1",
  "pursers-client==0.1.0a19",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_central*"]
