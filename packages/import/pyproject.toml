[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-personal-import"
version = "5.0.0a3"
description = "Copy-only importer from On Board v4 into Pursers Personal"
readme = "PERSONAL-IMPORT.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
pursers-personal-import = "pursers_personal_import.personal_import:main"
