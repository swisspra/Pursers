[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-client"
version = "0.1.2"
description = "Async Python client for the Pursers Central service"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp==2.2.0",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44,<51",
]

[project.scripts]
pursers-mcp = "pursers_client.mcp_proxy:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_client*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
