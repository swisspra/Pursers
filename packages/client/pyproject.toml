[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pursers-client"
version = "0.1.0a10"
description = "Async client for the On Board central service"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp==2.0.0",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44,<51",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pursers_client*"]
